; Esp32CarLed - sterowanie swiatlami modelu Peugeot 9X8
; ESP32-C3 + tasma WS2812B (22 diody)

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    ; Odkomentuj dwie ponizsze linie, jesli masz plytke ESP32-C3 SuperMini
    ; (USB podlaczone bezposrednio do ESP32-C3, bez ukladu CH340/CP2102),
    ; inaczej Serial Monitor nic nie pokaze.
    ; -DARDUINO_USB_MODE=1
    ; -DARDUINO_USB_CDC_ON_BOOT=1

; Zmiana trybu flash na DIO (rozwiązuje pętlę resetu)
board_build.flash_mode = dio

; Dodatkowo możesz zdefiniować częstotliwość flashowania (opcjonalnie)
board_build.f_flash = 80000000L

; Biblioteki sa skopiowane do katalogu lib/ (FastLED 3.9.20, AsyncTCP 3.5.0,
; ESPAsyncWebServer 3.12.1, ArduinoJson 7.4.3), wiec nie sa pobierane z sieci.
; Aby wrocic do pobierania: odkomentuj lib_deps i usun katalogi z lib/.
; lib_deps =
;     fastled/FastLED@~3.9.20
;     ESP32Async/AsyncTCP@^3.3.2
;     ESP32Async/ESPAsyncWebServer@^3.6.0
;     bblanchon/ArduinoJson@^7.2.0

; Wgrywanie przez WiFi (OTA): pio run -e esp32c3_ota -t upload
; ESP musi byc w tej samej sieci. Zamiast carled.local mozna wpisac adres IP
; (w hotspocie CarLed: 192.168.4.1). --auth = OTA_PASSWORD z config.h.
[env:esp32c3_ota]
extends = env:esp32c3
upload_protocol = espota
upload_port = carled.local
upload_flags =
    --port=3232
    --auth=carled
